<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Amit Sehgal — Senior Data Engineer | Interactive Pipeline Resume. 9 years architecting high-performance data platforms across Azure, PySpark, Kafka, and Databricks.">
  <meta name="author" content="Amit Sehgal">

  <meta property="og:title" content="Amit Sehgal — Senior Data Engineer | Pipeline Resume">
  <meta property="og:description" content="Interactive ETL pipeline portfolio. Click nodes to explore experience, skills, and projects.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://amitsehgal29.github.io/resume/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Amit Sehgal — Senior Data Engineer">

  <title>Amit Sehgal — Pipeline Resume</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/pipeline.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Amit Sehgal",
    "jobTitle": "Senior Data Engineer",
    "email": "reachamitsehgal29@gmail.com",
    "telephone": "+971-506889952",
    "address": { "@type": "PostalAddress", "addressLocality": "Dubai", "addressCountry": "AE" },
    "url": "https://linkedin.com/in/sehgal-amit",
    "alumniOf": { "@type": "CollegeOrUniversity", "name": "Mumbai University" },
    "knowsAbout": ["PySpark", "Apache Kafka", "Apache Airflow", "Azure Data Factory", "Databricks", "ETL Pipelines", "Data Engineering"]
  }
  </script>
</head>
<body>

<div class="app">

  <!-- ════════════════════════════════════════════════════════════
       TOOLBAR
       ════════════════════════════════════════════════════════════ -->
  <header class="toolbar">
    <div class="toolbar__brand">
      <span class="toolbar__brand-dot"></span>
      Amit Sehgal
    </div>
    <span class="toolbar__pipeline-name">pipeline: amit_resume_dag</span>
    <div class="toolbar__spacer"></div>
    <span id="pipeline-status" class="status-badge status--ready">Ready</span>
    <button id="btn-run" class="toolbar-btn toolbar-btn--primary">▶ Run Pipeline</button>
    <a href="Amit Sehgal Resume.pdf" download class="toolbar-btn">📄 Download</a>
    <a href="https://linkedin.com/in/sehgal-amit" target="_blank" rel="noopener noreferrer" class="toolbar-btn">🔗 LinkedIn</a>
  </header>

  <!-- ════════════════════════════════════════════════════════════
       MAIN AREA — Canvas + Detail Panel
       ════════════════════════════════════════════════════════════ -->
  <div class="main-area">

    <!-- Pipeline Canvas -->
    <main id="pipeline-canvas" class="pipeline-canvas">
      <div class="pipeline-canvas__inner">
        <svg id="pipeline-svg" class="pipeline-svg-layer" xmlns="http://www.w3.org/2000/svg"></svg>
        <!-- Nodes are rendered here by pipeline-engine.js -->
      </div>
    </main>

    <!-- Detail Panel (slides in from right) -->
    <aside id="detail-panel" class="detail-panel">
      <div class="detail-panel__header">
        <h2 id="detail-title" class="detail-panel__title">Select a node</h2>
        <button id="btn-close-panel" class="detail-panel__close" aria-label="Close panel">✕</button>
      </div>
      <div id="detail-content" class="detail-panel__body">
        <p class="detail-text" style="color: var(--color-text-tertiary); text-align: center; margin-top: 48px;">
          ← Click any pipeline node<br>to see details here
        </p>
      </div>
    </aside>

  </div>

  <!-- ════════════════════════════════════════════════════════════
       STATUS BAR
       ════════════════════════════════════════════════════════════ -->
  <footer class="statusbar">
    <span class="statusbar__item">Pipeline: amit_resume_dag</span>
    <span class="statusbar__item">Nodes: <span id="node-count">0</span></span>
    <span class="statusbar__item">Connections: <span id="connection-count">0</span></span>
    <span class="statusbar__item" style="margin-left: auto;">Bronze → Silver → Gold medallion architecture</span>
  </footer>

</div>

<script src="assets/js/pipeline-engine.js"></script>
</body>
</html>
